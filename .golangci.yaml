version: "2"
linters:
  default: all
  enable:
    - wsl_v5
  disable:
    - depguard
    - err113
    - exhaustruct
    - gochecknoglobals
    - mnd
    - tagliatelle
    - varnamelen
    - wsl
  settings:
    staticcheck:
        checks:
          - all
          # Incorrect or missing package comment.
          # https://staticcheck.dev/docs/checks/#ST1000
          - -ST1000
    gomoddirectives:
      replace-local: true
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - [{skipPackageNameChecks: true}]
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
