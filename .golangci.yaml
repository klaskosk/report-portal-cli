version: "2"
linters:
  default: all
  enable:
    - gomodguard_v2
    - wsl_v5
  disable:
    - depguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - goconst
    - gochecknoglobals
    - gomodguard
    - mnd
    - tagliatelle
    - wsl
  settings:
    gomoddirectives:
      replace-local: true
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - [{skipPackageNameChecks: true}]
    staticcheck:
        checks:
          - all
          # Incorrect or missing package comment.
          # https://staticcheck.dev/docs/checks/#ST1000
          - -ST1000
    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - i
        - err
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - dupl
      - path: internal/cli/core/.*_test\.go
        linters:
          - testpackage
      # Domain packages return core errors without re-wrapping; same as pre-refactor flat package.
      - path: internal/cli/(activity|activityevent|auth|bts|dashboard|demodata|download|filter|group|integration|item|launch|log|logtype|plugin|project|setting|user|whoami|widget)/
        linters:
          - wrapcheck
      - path: internal/cli/group/group_associations\.go
        linters:
          - dupl
      # Domain packages return core errors without re-wrapping; same as pre-refactor flat package.
      - path: pkg/client/(activity|bts|dashboard|demodata|files|filter|groups|integrations|item|launch|log|logtypes|onboarding|plugin|projects|settings|users|widget)/
        linters:
          - wrapcheck
          - funcorder
      - path: pkg/client/project\.go
        linters:
          - wrapcheck
      - path: pkg/client/internal/core/
        linters:
          - funcorder
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
run:
  allow-serial-runners: true
