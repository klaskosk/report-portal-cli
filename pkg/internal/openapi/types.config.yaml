# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: types
output: ../../types/types.gen.go

generate:
  models: true

output-options:
  skip-fmt: false
  skip-prune: true
  nullable-type: false
  name-normalizer: ToCamelCaseWithDigits
  overlay:
    path: overlay.components.openapi.yaml

import-mapping:
  components.openapi.yaml: "-"
