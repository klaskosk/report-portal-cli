# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: types
output: ../../types/types.gen.go

generate:
  models: true

compatibility:
  # Keep generated enum constant names stable and descriptive; without this,
  # oapi-codegen only prefixes names when it detects a conflict, which depends
  # on schema ordering and can silently rename constants between spec syncs.
  always-prefix-enum-values: true

output-options:
  skip-fmt: false
  skip-prune: true
  nullable-type: false
  name-normalizer: ToCamelCaseWithDigits
  overlay:
    path: overlay.components.openapi.yaml

import-mapping:
  components.openapi.yaml: "-"
