overlay: 1.0.0
info:
  title: Patch timestamps, ID types, and response fields
  version: 1.0.0
actions:
  # StartLaunchRS, EntryCreatedAsyncRS, FinishLaunchRS, and BatchElementCreatedRS expose the new entity UUID in JSON as
  # "id" (string). Do not rename to "uuid" in the schema: the wire format stays "id", and mismatched json tags break
  # clients at runtime.
  # BinaryContent.id and thumbnailId are numeric in the data model but Report Portal often serializes them as JSON
  # strings (especially in nested log list payloads). Keep the spec as string so decoding matches the wire format.
  # Sidecar schemas (activity-page.openapi.yaml, widget-names.openapi.yaml) let the API generator resolve $ref
  # values that overlay.openapi.yaml introduces. The corresponding Go types must also exist in the types package,
  # so we duplicate the definitions here for the types generator. See activity-page.openapi.yaml for details.
  - target: $.components.schemas
    update:
      PageActivityEventResource:
        type: object
        required:
          - content
          - page
        properties:
          content:
            type: array
            items:
              $ref: 'components.openapi.yaml#/components/schemas/ActivityEventResource'
          page:
            $ref: 'components.openapi.yaml#/components/schemas/PageMetadata'
      WidgetNamesIterable:
        type: object
        required:
          - content
          - page
        properties:
          content:
            type: array
            items:
              type: string
          page:
            $ref: 'components.openapi.yaml#/components/schemas/PageMetadata'
  # Fix ErrorRS schema to match actual API responses. The API returns integer error codes (e.g. 4041, 40011), not the
  # string enum values defined in the original spec.
  - target: $.components.schemas.ErrorRS.properties.errorCode
    update:
      type: integer
      enum: null
  - target: $.components.schemas.ErrorRS
    update:
      required:
        - errorCode
        - message
