overlay: 1.0.0
info:
  title: Patch timestamps to Epoch
  version: 1.0.0
actions:
  # Timestamp fields are actually returned as integers with millisecond (or in the future, microsecond) precision. We
  # use a custom type in Go to handle this automatically.
  - target: $..[?(@.format == 'date-time')]
    update:
      x-go-type: EpochMillis
  # The following targets are all to better type the generated Iterables. They use the standard Spring Boot format, but
  # the OpenAPI spec defines them as objects with no further details.
  - target: $.components.schemas
    update:
      PageMetadata:
        type: object
        required:
          - number
          - size
          - totalElements
          - totalPages
        properties:
          number:
            type: integer
          size:
            type: integer
          totalElements:
            type: integer
          totalPages:
            type: integer
  - target: $.components.schemas['Iterable«ActivityEventResource»']
    update:
      type: object
      required:
        - content
        - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEventResource'
        page:
          $ref: '#/components/schemas/PageMetadata'
  - target: $.components.schemas['Iterable«ClusterInfoResource»']
    update:
      type: object
