openapi: 3.1.0
info:
  contact:
    email: support@reportportal.io
    name: Support
  description: ReportPortal API documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  title: ReportPortal
  version: 5.15.0
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - description: Activities API collection
    name: Activity
  - description: Activity Events API collection
    name: Activity Event
  - description: Bug Tracking Systems API collection
    name: Bug Tracking System
  - description: Dashboards API collection
    name: Dashboard
  - description: Demo data API collection
    name: Demo Data
  - description: Files Storage API collection
    name: File Storage
  - description: Integrations API collection
    name: Integration
  - description: Launches API collection
    name: Launch
  - description: Launches Async API collection
    name: Launch Async
  - description: Logs API collection
    name: Log
  - description: Logs Async API collection
    name: Log Async
  - description: Onboardings API collection
    name: Onboarding
  - description: Plugins API collection
    name: Plugin
  - description: Plugins Public API collection
    name: Plugin Public
  - description: Projects API collection
    name: Project
  - description: Project Settings API collection
    name: Project Settings
  - description: Settings API collection
    name: Settings
  - description: Test Items API collection
    name: Test Item
  - description: Test Items Async API collection
    name: Test Item Async
  - description: Users API collection
    name: User
  - description: User Filters API collection
    name: User Filter
  - description: Widgets API collection
    name: Widget
  - description: API for managing groups and their members.
    name: groups
  - description: API for working with projects.
    name: projects
components:
  schemas:
    ActivityEventResource:
      properties:
        created_at:
          description: The time the activity was created
          example: "2021-07-01T12:00:00Z"
          format: date-time
          type: string
        details:
          description: The details of the activity, for example history of value
          example:
            history:
              - field: status
                newValue: FAILED
                oldValue: PASSED
        event_name:
          description: The name of the event
          example: updateItem
          type: string
        id:
          description: The unique ID of the activity
          example: 1
          format: int64
          type: integer
        object_id:
          description: The ID of the object on which activity was performed
          example: 1
          format: int64
          type: integer
        object_name:
          description: The name of the object on which activity was performed
          example: Test item name
          type: string
        object_type:
          description: The type of the object on which activity was performed
          example: itemIssue
          type: string
        project_id:
          description: The ID of the project
          example: 1
          format: int64
          type: integer
        project_name:
          description: The name of the project
          example: Project name
          type: string
        subject_id:
          description: The ID of the subject who performed the activity
          example: 1
          type: string
        subject_name:
          description: The name of the subject who performed the activity
          example: Username
          type: string
        subject_type:
          description: The type of the subject who performed the activity
          example: user
          type: string
      required:
        - created_at
        - event_name
        - id
        - object_id
        - object_name
        - object_type
        - project_id
        - project_name
        - subject_id
        - subject_name
        - subject_type
      type: object
    ActivityResource:
      properties:
        actionType:
          description: The type of action performed
          example: startLaunch
          type: string
        details:
          description: The details of the activity, for example history of value
          example:
            history:
              - field: status
                newValue: FAILED
                oldValue: PASSED
        id:
          description: The unique ID of the activity
          example: 1
          format: int64
          type: integer
        lastModified:
          description: The time the activity was last modified
          example: "2021-07-01T12:00:00Z"
          format: date-time
          type: string
        loggedObjectId:
          description: The ID of the object on which activity was performed
          example: 1
          format: int64
          type: integer
        objectName:
          description: The name of the object on which the activity was performed
          example: Launch name
          type: string
        objectType:
          description: The type of object on which the activity was performed
          example: LAUNCH
          type: string
        projectId:
          description: The ID of the project in which the activity was performed
          example: 1
          format: int64
          type: integer
        projectName:
          description: The name of the project in which the activity was performed
          example: project
          type: string
        user:
          description: The user who performed the activity
          example: user
          type: string
      required:
        - actionType
        - id
        - lastModified
        - loggedObjectId
        - objectType
        - projectId
        - user
      type: object
    AddProjectToGroupByIdRequest:
      properties:
        permission:
          enum:
            - PROJECT_MANAGER
            - MEMBER
            - OPERATOR
            - CUSTOMER
          type: string
      type: object
    AddWidgetRq:
      properties:
        addWidget:
          $ref: components.openapi.yaml#/components/schemas/WidgetObjectModel
      required:
        - addWidget
      type: object
    AllowedValue:
      properties:
        valueId:
          type: string
        valueName:
          type: string
      type: object
    AnalyticsResource:
      properties:
        enabled:
          type: boolean
        type:
          minLength: 1
          type: string
      required:
        - type
      type: object
    AnalyzeLaunchRQ:
      properties:
        analyzeItemsMode:
          items:
            enum:
              - TO_INVESTIGATE
              - AUTO_ANALYZED
              - MANUALLY_ANALYZED
            type: string
          type: array
        analyzerMode:
          enum:
            - ALL
            - LAUNCH_NAME
            - CURRENT_LAUNCH
            - PREVIOUS_LAUNCH
            - CURRENT_AND_THE_SAME_NAME
          type: string
        analyzerTypeName:
          enum:
            - autoAnalyzer
            - patternAnalyzer
          type: string
        launchId:
          format: int64
          type: integer
      required:
        - analyzeItemsMode
        - analyzerMode
        - analyzerTypeName
        - launchId
      type: object
    ApiKeyRQ:
      properties:
        name:
          pattern: '[A-Za-z0-9-._~+/]+$'
          type: string
      required:
        - name
      type: object
    ApiKeyRS:
      properties:
        api_key:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        user_id:
          format: int64
          type: integer
      required:
        - created_at
        - id
        - name
        - user_id
      type: object
    ApiKeysRS:
      properties:
        items:
          items:
            $ref: components.openapi.yaml#/components/schemas/ApiKeyRS
          type: array
      required:
        - items
      type: object
    AssignUsersRQ:
      properties:
        userNames:
          additionalProperties:
            type: string
          type: object
      required:
        - userNames
      type: object
    AssignedProject:
      properties:
        entryType:
          type: string
        projectId:
          format: int64
          type: integer
        projectRole:
          type: string
      type: object
    BatchElementCreatedRS:
      properties:
        id:
          type: string
        message:
          type: string
        stackTrace:
          type: string
      type: object
    BatchSaveOperatingRS:
      properties:
        responses:
          items:
            $ref: components.openapi.yaml#/components/schemas/BatchElementCreatedRS
          type: array
      type: object
    BinaryContent:
      properties:
        contentType:
          type: string
        id:
          type: string
        thumbnailId:
          type: string
      required:
        - contentType
        - id
        - thumbnailId
      type: object
    BulkInfoUpdateRQ:
      properties:
        attributes:
          items:
            $ref: components.openapi.yaml#/components/schemas/UpdateItemAttributeRQ
          type: array
        description:
          $ref: components.openapi.yaml#/components/schemas/Description
        ids:
          items:
            format: int64
            type: integer
          maxItems: 2.147483647e+09
          minItems: 1
          type: array
      required:
        - ids
      type: object
    BulkRQLongFinishExecutionRQ:
      properties:
        entities:
          additionalProperties:
            $ref: components.openapi.yaml#/components/schemas/FinishExecutionRQ
          type: object
      required:
        - entities
      type: object
    BulkRQLongUpdateLaunchRQ:
      properties:
        entities:
          additionalProperties:
            $ref: components.openapi.yaml#/components/schemas/UpdateLaunchRQ
          type: object
      required:
        - entities
      type: object
    BulkUpdateFilterRQ:
      properties:
        conditions:
          items:
            $ref: components.openapi.yaml#/components/schemas/UserFilterCondition
          maxItems: 20
          minItems: 1
          type: array
          uniqueItems: true
        description:
          maxLength: 1500
          minLength: 0
          type: string
        id:
          minLength: 1
          type: string
        name:
          type: string
        orders:
          items:
            $ref: components.openapi.yaml#/components/schemas/Order
          maxItems: 2.147483647e+09
          minItems: 1
          type: array
        type:
          enum:
            - launch
            - testitem
            - log
          minLength: 1
          type: string
      required:
        - conditions
        - id
        - name
        - orders
        - type
      type: object
    ChangePasswordRQ:
      properties:
        newPassword:
          type: string
        oldPassword:
          minLength: 1
          type: string
      required:
        - oldPassword
      type: object
    ChartStatisticsContent:
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        number:
          format: int32
          type: integer
        startTime:
          format: date-time
          type: string
        values:
          additionalProperties:
            type: string
          type: object
      type: object
    ClusterInfoResource:
      properties:
        id:
          format: int64
          type: integer
        index:
          format: int64
          type: integer
        launchId:
          format: int64
          type: integer
        matchedTests:
          format: int64
          type: integer
        message:
          type: string
        metadata:
          additionalProperties: {}
          type: object
      type: object
    CollectionsRQBulkUpdateFilterRQ:
      properties:
        elements:
          items:
            $ref: components.openapi.yaml#/components/schemas/BulkUpdateFilterRQ
          type: array
      required:
        - elements
      type: object
    ContentParameters:
      properties:
        contentFields:
          items:
            type: string
          type: array
        itemsCount:
          format: int32
          type: integer
        widgetOptions:
          additionalProperties: {}
          type: object
      type: object
    CreateClustersRQ:
      properties:
        launchId:
          format: int64
          type: integer
        removeNumbers:
          type: boolean
      required:
        - launchId
      type: object
    CreateDashboardRQ:
      properties:
        description:
          maxLength: 1500
          minLength: 0
          type: string
        name:
          type: string
      required:
        - name
      type: object
    CreateGroupRequest:
      description: Create group request.
      properties:
        name:
          description: Display name.
          maxLength: 60
          minLength: 3
          pattern: ^[A-Za-z0-9.'_\- ]+$
          type: string
        slug:
          description: A slug is used to identify a resource. It should be unique and contain only lowercase letters, numbers, and hyphens. It should not start or end with a hyphen.
          maxLength: 60
          minLength: 3
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          type: string
      required:
        - name
      type: object
    CreateIssueSubTypeRQ:
      properties:
        color:
          example: string
          minLength: 1
          pattern: '#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'
          type: string
        longName:
          maxLength: 55
          minLength: 3
          type: string
        shortName:
          example: string
          maxLength: 4
          minLength: 1
          type: string
        typeRef:
          minLength: 1
          type: string
      required:
        - color
        - longName
        - shortName
        - typeRef
      type: object
    CreatePatternTemplateRQ:
      properties:
        enabled:
          type: boolean
        name:
          maxLength: 55
          minLength: 1
          type: string
        type:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
      required:
        - enabled
        - name
        - type
        - value
      type: object
    CreateProjectRQ:
      properties:
        entryType:
          enum:
            - INTERNAL
          minLength: 1
          type: string
        projectName:
          example: string
          maxLength: 256
          minLength: 3
          pattern: '[a-zA-Z0-9-_]+'
          type: string
      required:
        - entryType
        - projectName
      type: object
    CreateUserBidRS:
      properties:
        backLink:
          type: string
        bid:
          type: string
        message:
          type: string
      type: object
    CreateUserRQ:
      properties:
        defaultProject:
          minLength: 1
          type: string
        email:
          minLength: 1
          type: string
        role:
          minLength: 1
          type: string
      required:
        - email
      type: object
    CreateUserRQConfirm:
      properties:
        email:
          minLength: 1
          type: string
        fullName:
          example: string
          maxLength: 256
          minLength: 3
          pattern: '[\pL0-9-_ \.]+'
          type: string
        login:
          example: string
          maxLength: 128
          minLength: 1
          pattern: '[a-zA-Z0-9-_.]+'
          type: string
        password:
          type: string
      required:
        - email
        - fullName
        - login
        - password
      type: object
    CreateUserRQFull:
      properties:
        accountRole:
          enum:
            - USER
            - ADMINISTRATOR
          type: string
        accountType:
          enum:
            - INTERNAL
            - SCIM
          type: string
        active:
          default: true
          type: boolean
        defaultProject:
          type: string
        email:
          minLength: 1
          type: string
        externalId:
          type: string
        fullName:
          example: string
          maxLength: 256
          minLength: 3
          pattern: '[\pL0-9-_ \.]+'
          type: string
        login:
          example: string
          maxLength: 128
          minLength: 1
          pattern: '[a-zA-Z0-9-_.]+'
          type: string
        password:
          type: string
        projectRole:
          enum:
            - CUSTOMER
            - MEMBER
            - PROJECT_MANAGER
          type: string
      required:
        - email
        - fullName
        - login
      type: object
    CreateUserRS:
      properties:
        accountRole:
          type: string
        accountType:
          type: string
        active:
          type: boolean
        email:
          type: string
        externalId:
          type: string
        fullName:
          type: string
        id:
          format: int64
          type: integer
        login:
          type: string
        uuid:
          format: uuid
          type: string
        warning:
          type: string
      type: object
    DashboardConfigResource:
      properties:
        widgets:
          items:
            $ref: components.openapi.yaml#/components/schemas/WidgetConfigResource
          type: array
      type: object
    DashboardPreconfiguredRq:
      properties:
        config:
          $ref: components.openapi.yaml#/components/schemas/DashboardConfigResource
        description:
          maxLength: 1500
          minLength: 0
          type: string
        name:
          type: string
      required:
        - config
        - name
      type: object
    DashboardResource:
      properties:
        description:
          maxLength: 1500
          minLength: 1
          type: string
        id:
          format: int64
          type: integer
        name:
          maxLength: 128
          minLength: 3
          type: string
        owner:
          type: string
        widgets:
          items:
            $ref: components.openapi.yaml#/components/schemas/WidgetObjectModel
          type: array
      required:
        - id
        - name
      type: object
    DefineIssueRQ:
      properties:
        issues:
          items:
            $ref: components.openapi.yaml#/components/schemas/IssueDefinition
          maxItems: 300
          minItems: 0
          type: array
      required:
        - issues
      type: object
    DeleteBulkRS:
      properties:
        errors:
          items:
            $ref: components.openapi.yaml#/components/schemas/ErrorRS
          type: array
        notFound:
          items:
            format: int64
            type: integer
          type: array
        successfullyDeleted:
          items:
            format: int64
            type: integer
          type: array
      type: object
    DemoDataRq:
      properties:
        createDashboard:
          type: boolean
      type: object
    DemoDataRs:
      properties:
        dashboardId:
          format: int64
          type: integer
        launchIds:
          items:
            format: int64
            type: integer
          type: array
      type: object
    Description:
      properties:
        action:
          enum:
            - DELETE
            - UPDATE
            - CREATE
          type: string
        comment:
          type: string
      type: object
    EditUserRQ:
      properties:
        accountType:
          enum:
            - INTERNAL
            - SCIM
          type: string
        active:
          type: boolean
        email:
          type: string
        externalId:
          type: string
        fullName:
          example: string
          maxLength: 256
          minLength: 3
          pattern: (\s*[\pL0-9-_\.]+\s*)+
          type: string
        role:
          type: string
      required:
        - fullName
      type: object
    EntryCreatedAsyncRS:
      properties:
        id:
          type: string
      type: object
    EntryCreatedRS:
      properties:
        id:
          format: int64
          type: integer
      type: object
    Error:
      description: ReportPortal Error
      properties:
        errorCode:
          format: int64
          minimum: 4000
          type: integer
        message:
          type: string
      type: object
    ErrorRS:
      properties:
        errorCode:
          enum:
            - INCORRECT_REQUEST
            - BINARY_DATA_CANNOT_BE_SAVED
            - ACCESS_DENIED
            - ADDRESS_LOCKED
            - PROJECT_NOT_FOUND
            - LAUNCH_NOT_FOUND
            - TEST_SUITE_NOT_FOUND
            - TEST_ITEM_NOT_FOUND
            - LOG_NOT_FOUND
            - ROLE_NOT_FOUND
            - USER_NOT_FOUND
            - WIDGET_NOT_FOUND
            - WIDGET_NOT_FOUND_IN_DASHBOARD
            - DASHBOARD_NOT_FOUND
            - USER_FILTER_NOT_FOUND
            - ACTIVITY_NOT_FOUND
            - UNABLE_TO_CREATE_WIDGET
            - INTEGRATION_NOT_FOUND
            - PROJECT_NOT_CONFIGURED
            - SERVER_SETTINGS_NOT_FOUND
            - ISSUE_TYPE_NOT_FOUND
            - PROJECT_SETTINGS_NOT_FOUND
            - TICKET_NOT_FOUND
            - AUTH_INTEGRATION_NOT_FOUND
            - WIDGET_NOT_FOUND_IN_PROJECT
            - USER_FILTER_NOT_FOUND_IN_PROJECT
            - DASHBOARD_NOT_FOUND_IN_PROJECT
            - PATTERN_TEMPLATE_NOT_FOUND_IN_PROJECT
            - TEST_ITEM_OR_LAUNCH_NOT_FOUND
            - ANALYZER_NOT_FOUND
            - ATTACHMENT_NOT_FOUND
            - UNABLE_TO_LOAD_BINARY_DATA
            - CLUSTER_NOT_FOUND
            - ORGANIZATION_NOT_FOUND
            - NOT_FOUND
            - INCORRECT_FILTER_PARAMETERS
            - INCORRECT_SORTING_PARAMETERS
            - INCORRECT_INTEGRATION_NAME
            - UNABLE_MODIFY_SHARABLE_RESOURCE
            - INCORRECT_AUTHENTICATION_TYPE
            - UNABLE_POST_TICKET
            - UNABLE_INTERACT_WITH_INTEGRATION
            - UNABLE_ASSIGN_UNASSIGN_USER_TO_PROJECT
            - EMAIL_CONFIGURATION_IS_INCORRECT
            - PROJECT_UPDATE_NOT_ALLOWED
            - UNABLE_TO_UPDATE_YOURSELF_ROLE
            - FORBIDDEN_OPERATION
            - RESOURCE_ALREADY_EXISTS
            - ROLE_ALREADY_EXISTS_ERROR
            - USER_ALREADY_EXISTS
            - USER_FILTER_ALREADY_EXISTS
            - PROJECT_ALREADY_EXISTS
            - DASHBOARD_UPDATE_ERROR
            - UNABLE_LOAD_WIDGET_CONTENT
            - UNABLE_ADD_TO_FAVORITE
            - INTEGRATION_ALREADY_EXISTS
            - SERVER_SETTINGS_ALREADY_EXISTS
            - UNABLE_REMOVE_FROM_FAVORITE
            - LAUNCH_IS_NOT_FINISHED
            - TEST_ITEM_IS_NOT_FINISHED
            - INCORRECT_FINISH_STATUS
            - BAD_REQUEST_ERROR
            - BAD_SAVE_LOG_REQUEST
            - REPORTING_ITEM_ALREADY_FINISHED
            - AMBIGUOUS_TEST_ITEM_STATUS
            - FAILED_TEST_ITEM_ISSUE_TYPE_DEFINITION
            - FINISH_TIME_EARLIER_THAN_START_TIME
            - FINISH_ITEM_NOT_ALLOWED
            - FINISH_LAUNCH_NOT_ALLOWED
            - START_ITEM_NOT_ALLOWED
            - CHILD_START_TIME_EARLIER_THAN_PARENT
            - UNSUPPORTED_TEST_ITEM_TYPE
            - LOGGING_IS_NOT_ALLOWED
            - BAD_SAVE_WIDGET_REQUEST
            - BAD_UPDATE_WIDGET_REQUEST
            - UNABLE_LOAD_TEST_ITEM_HISTORY
            - BAD_SAVE_USER_FILTER_REQUEST
            - RETRIES_HANDLER_ERROR
            - IMPORT_FILE_ERROR
            - PARSING_XML_ERROR
            - OBJECT_RETRIEVAL_ERROR
            - PLUGIN_UPLOAD_ERROR
            - PLUGIN_REMOVE_ERROR
            - UNABLE_TO_SAVE_CHILD_ITEM_FOR_THE_RETRY
            - PATTERN_ANALYSIS_ERROR
            - PROJECT_DOESNT_CONTAIN_USER
            - UNCLASSIFIED_REPORT_PORTAL_ERROR
            - BAD_UPDATE_PREFERENCE_REQUEST
            - UNSUPPORTED_MERGE_STRATEGY_TYPE
            - DEMO_DATA_GENERATION_ERROR
            - UNCLASSIFIED_ERROR
          type: string
        message:
          type: string
        stackTrace:
          type: string
      type: object
    ExternalSystemIssue:
      properties:
        btsProject:
          minLength: 1
          type: string
        btsUrl:
          minLength: 1
          type: string
        pluginName:
          type: string
        submitDate:
          format: date-time
          type: string
        ticketId:
          minLength: 1
          type: string
        url:
          minLength: 1
          type: string
      required:
        - btsProject
        - btsUrl
        - ticketId
        - url
      type: object
    File:
      properties:
        name:
          type: string
      type: object
    FinishExecutionRQ:
      properties:
        attributes:
          items:
            $ref: components.openapi.yaml#/components/schemas/ItemAttributesRQ
          maxItems: 256
          minItems: 0
          type: array
          uniqueItems: true
        description:
          type: string
        endTime:
          format: date-time
          type: string
        status:
          enum:
            - PASSED
            - FAILED
            - STOPPED
            - SKIPPED
            - INTERRUPTED
            - CANCELLED
            - INFO
            - WARN
          type: string
      required:
        - endTime
      type: object
    FinishLaunchRS:
      properties:
        id:
          type: string
        link:
          type: string
        number:
          format: int64
          type: integer
      type: object
    FinishTestItemRQ:
      properties:
        attributes:
          items:
            $ref: components.openapi.yaml#/components/schemas/ItemAttributesRQ
          maxItems: 256
          minItems: 0
          type: array
          uniqueItems: true
        description:
          type: string
        endTime:
          format: date-time
          type: string
        issue:
          $ref: components.openapi.yaml#/components/schemas/Issue
        launchUuid:
          type: string
        retry:
          type: boolean
        retryOf:
          type: string
        status:
          enum:
            - PASSED
            - FAILED
            - STOPPED
            - SKIPPED
            - INTERRUPTED
            - CANCELLED
            - INFO
            - WARN
          type: string
        testCaseId:
          type: string
      required:
        - endTime
        - launchUuid
      type: object
    GetLogTypes200Response:
      properties:
        items:
          description: List of available log types for the project.
          items:
            $ref: components.openapi.yaml#/components/schemas/LogTypeResponse
          type: array
      type: object
    GetLogsUnderRq:
      properties:
        itemIds:
          items:
            format: int64
            type: integer
