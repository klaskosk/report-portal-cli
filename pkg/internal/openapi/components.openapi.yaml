      title: GetLogsUnderRq
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: integer
            format: int64
        logLevel:
          type: string
          enum:
          - error
          - warn
          - info
          - debug
          - trace
          - fatal
          - unknown
    IntegrationRQ:
      title: IntegrationRQ
      type: object
      properties:
        enabled:
          type: boolean
        integrationParameters:
          type: object
          properties: {}
