          type: object
          properties: {}
        enabled:
          type: boolean
        groupType:
          type: string
        name:
          type: string
        type:
          type: integer
          format: int64
    Issue:
      title: Issue
      required:
      - issueType
      type: object
      properties:
        autoAnalyzed:
          type: boolean
        comment:
          type: string
        externalSystemIssues:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/ExternalSystemIssue'
        ignoreAnalyzer:
          type: boolean
        issueType:
          type: string
    IssueDefinition:
      title: IssueDefinition
      required:
      - issue
      - testItemId
      type: object
      properties:
        issue:
          $ref: 'components.openapi.yaml#/components/schemas/Issue'
        testItemId:
          type: integer
          format: int64
    IssueSubTypeCreatedRS:
      title: IssueSubTypeCreatedRS
      type: object
      properties:
        id:
          type: integer
          format: int64
        locator:
          type: string
    IssueSubTypeResource:
      title: IssueSubTypeResource
      type: object
      properties:
        color:
          type: string
        id:
          type: integer
          format: int64
        locator:
          type: string
        longName:
          type: string
        shortName:
          type: string
        typeRef:
          type: string
    ItemAttributeResource:
      title: ItemAttributeResource
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ItemAttributesRQ:
      title: ItemAttributesRQ
      type: object
      properties:
        key:
          type: string
        system:
          type: boolean
          example: false
        value:
          type: string
    ItemPathName:
      title: ItemPathName
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Iterable«ActivityEventResource»:
      title: Iterable«ActivityEventResource»
      type: object
    Iterable«ClusterInfoResource»:
      title: Iterable«ClusterInfoResource»
      type: object
    Iterable«DashboardResource»:
      title: Iterable«DashboardResource»
      type: object
    Iterable«LaunchResource»:
      title: Iterable«LaunchResource»
      type: object
    Iterable«LogResource»:
      title: Iterable«LogResource»
      type: object
    Iterable«OwnedEntityResource»:
      title: Iterable«OwnedEntityResource»
      type: object
    Iterable«ProjectInfoResource»:
      title: Iterable«ProjectInfoResource»
      type: object
    Iterable«SearchLogRs»:
      title: Iterable«SearchLogRs»
      type: object
    Iterable«SearchUserResource»:
      title: Iterable«SearchUserResource»
      type: object
