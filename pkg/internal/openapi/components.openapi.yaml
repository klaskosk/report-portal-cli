          - FINISH_TIME_EARLIER_THAN_START_TIME
          - FINISH_ITEM_NOT_ALLOWED
          - FINISH_LAUNCH_NOT_ALLOWED
          - START_ITEM_NOT_ALLOWED
          - CHILD_START_TIME_EARLIER_THAN_PARENT
