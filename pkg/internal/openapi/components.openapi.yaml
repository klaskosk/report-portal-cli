      title: ExternalSystemIssue
      type: object
      properties:
        btsProject:
          type: string
        btsUrl:
          type: string
        pluginName:
          type: string
        submitDate:
          type: integer
          format: int64
        ticketId:
          type: string
        url:
          type: string
    File:
      title: File
      type: object
      properties:
        name:
          type: string
    FinishExecutionRQ:
      title: FinishExecutionRQ
      required:
      - endTime
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/ItemAttributesRQ'
        description:
          type: string
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PASSED
          - FAILED
          - STOPPED
          - SKIPPED
          - INTERRUPTED
          - CANCELLED
          - INFO
          - WARN
    FinishLaunchRS:
      title: FinishLaunchRS
      type: object
      properties:
        id:
          type: string
        link:
          type: string
        number:
          type: integer
          format: int64
    FinishTestItemRQ:
      title: FinishTestItemRQ
      required:
      - endTime
      - launchUuid
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/ItemAttributesRQ'
        description:
          type: string
        endTime:
          type: string
          format: date-time
        issue:
          $ref: 'components.openapi.yaml#/components/schemas/Issue'
        launchUuid:
          type: string
        retry:
          type: boolean
        retryOf:
          type: string
        status:
          type: string
          enum:
          - PASSED
          - FAILED
          - STOPPED
          - SKIPPED
          - INTERRUPTED
          - CANCELLED
          - INFO
          - WARN
        testCaseId:
          type: string
