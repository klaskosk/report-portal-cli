openapi: 3.0.1
info:
  title: ReportPortal
  description: Report Portal API documentation
  contact:
    name: Support
    email: support@reportportal.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: 5.11.0
servers:
  - url: '{protocol}://{authority}/api'
    description: ReportPortal server
    variables:
      protocol:
        default: https
        description: Protocol
        enum:
          - http
          - https
      authority:
        description: Host name and port (if needed) of Report Portal server
        default: demo.reportportal.io
# Manual added section
security:
  - bearerAuth: []
tags:
- name: activity-controller
  description: Activity Controller
- name: activity-event-controller
  description: Activity Event Controller
- name: bug-tracking-system-controller
  description: Bug Tracking System Controller
- name: dashboard-controller
  description: Dashboard Controller
- name: demo-data-controller
  description: Demo Data Controller
- name: deprecated-user-controller
  description: Deprecated UserController
- name: file-storage-controller
  description: File Storage Controller
- name: integration-controller
  description: Integration Controller
- name: launch-async-controller
  description: Launch Async Controller
- name: launch-controller
  description: Launch Controller
- name: log-async-controller
  description: Log Async Controller
- name: log-controller
  description: Log Controller
- name: onboarding-controller
  description: Onboarding Controller
- name: plugin-controller
  description: Plugin Controller
- name: plugin-public-controller
  description: Plugin Public Controller
- name: project-controller
  description: Project Controller
- name: project-settings-controller
  description: Project Settings Controller
- name: settings-controller
  description: Settings Controller
- name: test-item-async-controller
  description: Test Item Async Controller
- name: test-item-controller
  description: Test Item Controller
- name: user-controller
  description: User Controller
- name: user-filter-controller
  description: User Filter Controller
- name: widget-controller
  description: Widget Controller

components:
  schemas:
    ActivityEventResource:
      title: ActivityEventResource
      required:
      - event_name
      - id
      - object_id
      - object_name
      - object_type
      - project_id
      - project_name
      - subject_id
      - subject_name
      - subject_type
      type: object
      properties:
        created_at:
          type: string
          example: yyyy-MM-dd'T'HH:mm:ssZ
        details:
          type: object
          properties: {}
        event_name:
          type: string
        id:
          type: integer
          format: int64
        object_id:
          type: integer
          format: int64
        object_name:
          type: string
        object_type:
          type: string
        project_id:
          type: integer
          format: int64
        project_name:
          type: string
        subject_id:
          type: string
        subject_name:
          type: string
        subject_type:
          type: string
    ActivityResource:
      title: ActivityResource
      required:
      - actionType
      - id
      - lastModified
      - loggedObjectId
      - objectType
      - projectId
      - user
      type: object
      properties:
        actionType:
          type: string
        details:
          type: object
          properties: {}
        id:
          type: integer
          format: int64
        lastModified:
          type: string
          format: date-time
        loggedObjectId:
          type: integer
          format: int64
        objectName:
          type: string
        objectType:
          type: string
        projectId:
          type: integer
          format: int64
        projectName:
          type: string
        user:
          type: string
    AddWidgetRq:
      title: AddWidgetRq
      type: object
      properties:
        addWidget:
          $ref: 'components.openapi.yaml#/components/schemas/WidgetObjectModel'
    AllowedValue:
      title: AllowedValue
      type: object
      properties:
        valueId:
          type: string
        valueName:
          type: string
    AnalyticsResource:
      title: AnalyticsResource
      type: object
      properties:
        enabled:
          type: boolean
        type:
          type: string
    AnalyzeLaunchRQ:
      title: AnalyzeLaunchRQ
      type: object
      properties:
        analyzeItemsMode:
          type: array
          items:
            type: string
            enum:
            - TO_INVESTIGATE
            - AUTO_ANALYZED
            - MANUALLY_ANALYZED
        analyzerMode:
          type: string
          enum:
          - ALL
          - LAUNCH_NAME
          - CURRENT_LAUNCH
          - PREVIOUS_LAUNCH
          - CURRENT_AND_THE_SAME_NAME
        analyzerTypeName:
          type: string
          enum:
          - autoAnalyzer
          - patternAnalyzer
        launchId:
          type: integer
          format: int64
    ApiKeyRQ:
      title: ApiKeyRQ
      required:
      - name
      type: object
      properties:
        name:
          type: string
    ApiKeyRS:
      title: ApiKeyRS
      required:
      - id
      - name
      - user_id
      type: object
      properties:
        api_key:
          type: string
        created_at:
          type: string
          example: yyyy-MM-dd'T'HH:mm:ssZ
        id:
          type: integer
          format: int64
        last_used_at:
          type: string
          example: yyyy-MM-dd
        name:
          type: string
        user_id:
          type: integer
          format: int64
    ApiKeysRS:
      title: ApiKeysRS
      required:
      - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/ApiKeyRS'
    AssignUsersRQ:
      title: AssignUsersRQ
      required:
      - userNames
      type: object
      properties:
        userNames:
          type: object
          additionalProperties:
            type: string
    AssignedProject:
      title: AssignedProject
      type: object
      properties:
        entryType:
          type: string
        projectRole:
          type: string
    BatchElementCreatedRS:
      title: BatchElementCreatedRS
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        stackTrace:
          type: string
    BatchSaveOperatingRS:
      title: BatchSaveOperatingRS
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/BatchElementCreatedRS'
    BinaryContent:
      title: BinaryContent
      required:
      - contentType
      - id
      - thumbnailId
      type: object
      properties:
        contentType:
          type: string
        id:
          type: string
        thumbnailId:
          type: string
    BulkInfoUpdateRQ:
      title: BulkInfoUpdateRQ
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/UpdateItemAttributeRQ'
        description:
          $ref: 'components.openapi.yaml#/components/schemas/Description'
        ids:
          type: array
          items:
            type: integer
            format: int64
    BulkRQ«long,FinishExecutionRQ»:
      title: "BulkRQ«long,FinishExecutionRQ»"
      required:
      - entities
      type: object
      properties:
        entities:
          type: object
          additionalProperties:
            $ref: 'components.openapi.yaml#/components/schemas/FinishExecutionRQ'
    BulkRQ«long,UpdateLaunchRQ»:
      title: "BulkRQ«long,UpdateLaunchRQ»"
      required:
      - entities
      type: object
      properties:
        entities:
          type: object
          additionalProperties:
            $ref: 'components.openapi.yaml#/components/schemas/UpdateLaunchRQ'
    BulkUpdateFilterRQ:
      title: BulkUpdateFilterRQ
      required:
      - conditions
      - name
      - orders
      - type
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/UserFilterCondition'
        description:
          type: string
        id:
          type: string
        name:
          type: string
        orders:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/Order'
        type:
          type: string
          enum:
          - launch
          - testitem
          - log
    ChangePasswordRQ:
      title: ChangePasswordRQ
      type: object
      properties:
        newPassword:
          type: string
        oldPassword:
          type: string
    ChartStatisticsContent:
      title: ChartStatisticsContent
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        number:
          type: integer
          format: int32
        startTime:
          $ref: 'components.openapi.yaml#/components/schemas/Timestamp'
        values:
          type: object
          additionalProperties:
            type: string
    ClusterInfoResource:
      title: ClusterInfoResource
      type: object
      properties:
        id:
          type: integer
          format: int64
        index:
          type: integer
          format: int64
        launchId:
          type: integer
          format: int64
        message:
          type: string
        metadata:
          type: object
          properties: {}
    CollectionsRQ«BulkUpdateFilterRQ»:
      title: CollectionsRQ«BulkUpdateFilterRQ»
      required:
      - elements
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/BulkUpdateFilterRQ'
    ContentParameters:
      title: ContentParameters
      required:
      - contentFields
      - itemsCount
      type: object
      properties:
        contentFields:
          type: array
          items:
            type: string
        itemsCount:
          type: integer
          format: int32
        widgetOptions:
          type: object
          properties: {}
    CreateClustersRQ:
      title: CreateClustersRQ
      required:
      - launchId
      type: object
      properties:
        launchId:
          type: integer
          format: int64
        removeNumbers:
          type: boolean
    CreateDashboardRQ:
      title: CreateDashboardRQ
      required:
      - name
      type: object
      properties:
        description:
          type: string
        name:
          type: string
    CreateIssueSubTypeRQ:
      title: CreateIssueSubTypeRQ
      required:
      - color
      - longName
      - shortName
      - typeRef
      type: object
      properties:
        color:
          type: string
        longName:
          type: string
        shortName:
          type: string
        typeRef:
          type: string
    CreatePatternTemplateRQ:
      title: CreatePatternTemplateRQ
      type: object
      properties:
        enabled:
          type: boolean
        name:
          type: string
        type:
          type: string
        value:
          type: string
    CreateProjectRQ:
      title: CreateProjectRQ
      required:
      - entryType
      - projectName
      type: object
      properties:
        entryType:
          type: string
          enum:
          - INTERNAL
        projectName:
          type: string
    CreateUserBidRS:
      title: CreateUserBidRS
      type: object
      properties:
        backLink:
          type: string
        bid:
          type: string
        message:
          type: string
    CreateUserRQ:
      title: CreateUserRQ
      required:
      - defaultProject
      - email
      - role
      type: object
      properties:
        defaultProject:
          type: string
        email:
          type: string
        role:
          type: string
    CreateUserRQConfirm:
      title: CreateUserRQConfirm
      required:
      - email
      - fullName
      - login
      - password
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        login:
          type: string
        password:
          type: string
    CreateUserRQFull:
      title: CreateUserRQFull
      required:
      - accountRole
      - defaultProject
      - email
      - fullName
      - login
      - password
      - projectRole
      type: object
      properties:
        accountRole:
          type: string
          enum:
          - USER
          - ADMINISTRATOR
        defaultProject:
          type: string
        email:
          type: string
        fullName:
          type: string
        login:
          type: string
        password:
          type: string
        projectRole:
          type: string
          enum:
          - CUSTOMER
          - MEMBER
          - LEAD
          - PROJECT_MANAGER
    CreateUserRS:
      title: CreateUserRS
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        warning:
          type: string
    DashboardResource:
      title: DashboardResource
      required:
      - id
      - name
      type: object
      properties:
        description:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        owner:
          type: string
        widgets:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/WidgetObjectModel'
    DefineIssueRQ:
      title: DefineIssueRQ
      required:
      - issues
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/IssueDefinition'
    DeleteBulkRQ:
      title: DeleteBulkRQ
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    DeleteBulkRS:
      title: DeleteBulkRS
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: 'components.openapi.yaml#/components/schemas/ErrorRS'
        notFound:
          type: array
          items:
            type: integer
            format: int64
        successfullyDeleted:
          type: array
          items:
            type: integer
            format: int64
    DemoDataRq:
      title: DemoDataRq
      type: object
      properties:
        createDashboard:
          type: boolean
    DemoDataRs:
      title: DemoDataRs
      type: object
      properties:
        dashboardId:
          type: integer
          format: int64
        launchIds:
          type: array
          items:
            type: integer
            format: int64
    Description:
      title: Description
      type: object
      properties:
        action:
          type: string
          enum:
          - DELETE
          - UPDATE
          - CREATE
        comment:
          type: string
    EditUserRQ:
      title: EditUserRQ
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
    EntryCreatedAsyncRS:
      title: EntryCreatedAsyncRS
      type: object
      properties:
        id:
          type: string
    EntryCreatedRS:
      title: EntryCreatedRS
      type: object
      properties:
        id:
          type: integer
          format: int64
    Entry«long,int»:
      title: "Entry«long,int»"
      type: object
      properties:
        key:
          type: integer
          format: int64
        value:
          type: integer
          format: int32
    ErrorRS:
      title: ErrorRS
      type: object
      properties:
        errorCode:
          type: string
          enum:
          - INCORRECT_REQUEST
          - BINARY_DATA_CANNOT_BE_SAVED
          - ACCESS_DENIED
          - ADDRESS_LOCKED
          - PROJECT_NOT_FOUND
          - LAUNCH_NOT_FOUND
          - TEST_SUITE_NOT_FOUND
          - TEST_ITEM_NOT_FOUND
          - LOG_NOT_FOUND
          - ROLE_NOT_FOUND
          - USER_NOT_FOUND
          - WIDGET_NOT_FOUND
          - WIDGET_NOT_FOUND_IN_DASHBOARD
          - DASHBOARD_NOT_FOUND
          - USER_FILTER_NOT_FOUND
          - ACTIVITY_NOT_FOUND
          - UNABLE_TO_CREATE_WIDGET
          - INTEGRATION_NOT_FOUND
          - PROJECT_NOT_CONFIGURED
          - SERVER_SETTINGS_NOT_FOUND
          - ISSUE_TYPE_NOT_FOUND
          - PROJECT_SETTINGS_NOT_FOUND
