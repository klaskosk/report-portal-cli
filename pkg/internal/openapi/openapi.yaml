            maximum: 1000
            minimum: 0
            type: integer
        - description: The offset used for this page of results.
          in: query
          name: offset
          required: false
          schema:
            default: 0
            format: int32
            type: integer
        - description: Indicate sorting direction.
          in: query
          name: order
          required: false
          schema:
            default: ASC
            type: string
        - description: Indicate sort by field.
          in: query
          name: sort
          required: false
