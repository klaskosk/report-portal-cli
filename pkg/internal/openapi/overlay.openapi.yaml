overlay: 1.0.0
info:
  title: Patch timestamps, error responses, and ID types
  version: 1.0.0
actions:
  # Fix numeric ID path parameters that are incorrectly typed as strings.
  - target: $.paths['/v1/{projectName}/launch/{launchId}'].get.parameters[?(@.name == 'launchId')].schema
    update:
      type: integer
      format: int64
  - target: $.paths['/v1/{projectName}/item/{itemId}'].get.parameters[?(@.name == 'itemId')].schema
    update:
      type: integer
      format: int64
  - target: $.paths['/v1/{projectName}/log/{logId}'].get.parameters[?(@.name == 'logId')].schema
    update:
      type: integer
      format: int64
  # Add default error response to all API operations. The RP API returns ErrorRS for all error cases (400, 401, 403,
  # 404, 500, etc.). Using 'default' generates a single JSONDefault field on each response struct that captures any
  # non-success status code.
  - target: $.paths.*.get.responses
    update:
      default:
        description: Error response
        content:
          application/json:
            schema:
              $ref: 'components.openapi.yaml#/components/schemas/ErrorRS'
  - target: $.paths.*.post.responses
    update:
      default:
        description: Error response
        content:
          application/json:
            schema:
              $ref: 'components.openapi.yaml#/components/schemas/ErrorRS'
  - target: $.paths.*.put.responses
    update:
      default:
        description: Error response
        content:
          application/json:
            schema:
              $ref: 'components.openapi.yaml#/components/schemas/ErrorRS'
  - target: $.paths.*.delete.responses
    update:
      default:
        description: Error response
        content:
          application/json:
            schema:
              $ref: 'components.openapi.yaml#/components/schemas/ErrorRS'
  # /v1/{projectName}/activity/item/{itemId} returns Page in the spec, but content is ActivityEventResource[].
  - target: $.paths['/v1/{projectName}/activity/item/{itemId}'].get.responses['200'].content['application/json'].schema
    update:
      $ref: 'activity-page.openapi.yaml#/components/schemas/PageActivityEventResource'
  # /v1/{projectName}/widget/names/all returns a paged object with string content items.
  - target: $.paths['/v1/{projectName}/widget/names/all'].get.responses['200'].content['application/json'].schema
    update:
      $ref: 'widget-names.openapi.yaml#/components/schemas/WidgetNamesIterable'
