name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "prompts/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  ci:
    name: Lint, unit tests, and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            pkg/go.sum
            test/integration/go.sum

      - name: Lint (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint (pkg module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: pkg

      - name: Lint (test/integration module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: test/integration

      - run: make test

      - name: Run integration tests and write Ginkgo report
        run: |
          set -euo pipefail
          cd test/integration
          go test -tags=integration \
            -cover \
            -coverpkg=github.com/klaskosk/report-portal-cli/...,github.com/klaskosk/report-portal-cli/pkg/... \
            -v \
            -count=1 \
            -timeout 10m \
            -ginkgo.json-report=integration-report.json \
            ./...

      - name: Fail if any specs are skipped or fail
        run: |
          set -euo pipefail

          report="test/integration/integration-report.json"
          non_passed_states=$(jq -r '
            [
              .[].SpecReports[]
              | select(.State != "passed")
              | "\(.State): \((.ContainerHierarchyTexts + [.LeafNodeText]) | join(" > "))"
            ] | .[]
          ' "$report")

          if [[ -n "$non_passed_states" ]]; then
            printf 'found non-passed specs:\n%s\n' "$non_passed_states"
            exit 1
          fi
