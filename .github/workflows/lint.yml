name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "prompts/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
